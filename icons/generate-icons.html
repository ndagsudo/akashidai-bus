<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>アイコン生成ツール</title>
  <style>
    body { font-family: sans-serif; padding: 30px; background: #f0f4fb; }
    h1 { color: #0a84ff; margin-bottom: 20px; }
    canvas { display: none; }
    .btn { display:inline-block; padding:12px 24px; background:#0a84ff; color:#fff; border:none; border-radius:8px; cursor:pointer; font-size:15px; margin:8px; }
    p { margin:10px 0; color:#555; line-height:1.6; }
    .note { background:#e8f0fb; border-left:4px solid #0a84ff; padding:12px 16px; border-radius:0 8px 8px 0; margin-top:20px; }
  </style>
</head>
<body>
  <h1>🚌 PWAアイコン生成ツール</h1>
  <p>このページをブラウザで開き、下のボタンでアイコンPNGを生成・ダウンロードしてください。<br>
     ダウンロードしたファイルを <code>icons/</code> フォルダに配置してください。</p>

  <canvas id="c192" width="192" height="192"></canvas>
  <canvas id="c512" width="512" height="512"></canvas>

  <br>
  <button class="btn" onclick="generate(192)">icon-192.png をダウンロード</button>
  <button class="btn" onclick="generate(512)">icon-512.png をダウンロード</button>

  <div class="note">
    <strong>配置先：</strong><code>akashidai-bus/icons/icon-192.png</code> と <code>icon-512.png</code><br>
    GitHub Pagesにデプロイする前に必ず配置してください。
  </div>

  <script>
    function generate(size) {
      const canvas = document.getElementById('c' + size);
      const ctx = canvas.getContext('2d');
      const s = size;
      const unit = s / 192;

      // 背景
      const grad = ctx.createLinearGradient(0, 0, s, s);
      grad.addColorStop(0, '#0a84ff');
      grad.addColorStop(1, '#0060df');
      ctx.fillStyle = grad;
      roundRect(ctx, 0, 0, s, s, s * 0.22);
      ctx.fill();

      // バスの車体
      const bodyX = s * 0.16, bodyY = s * 0.30, bodyW = s * 0.68, bodyH = s * 0.40;
      ctx.fillStyle = '#ffffff';
      roundRect(ctx, bodyX, bodyY, bodyW, bodyH, s * 0.07);
      ctx.fill();

      // 窓
      ctx.fillStyle = '#0a84ff';
      const winY = bodyY + bodyH * 0.18;
      const winH = bodyH * 0.38;
      const winCount = 3;
      const winGap = s * 0.03;
      const totalGap = winGap * (winCount + 1);
      const winW = (bodyW - totalGap) / winCount;
      for (let i = 0; i < winCount; i++) {
        const wx = bodyX + winGap + i * (winW + winGap);
        roundRect(ctx, wx, winY, winW, winH, s * 0.02);
        ctx.fill();
      }

      // 下部ライン
      ctx.fillStyle = '#ffcc00';
      ctx.fillRect(bodyX, bodyY + bodyH * 0.68, bodyW, bodyH * 0.1);

      // タイヤ
      ctx.fillStyle = '#1c1c1e';
      const wheelY = bodyY + bodyH;
      const wheelR = s * 0.065;
      ctx.beginPath(); ctx.arc(bodyX + bodyW * 0.26, wheelY, wheelR, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(bodyX + bodyW * 0.74, wheelY, wheelR, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(bodyX + bodyW * 0.26, wheelY, wheelR * 0.4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(bodyX + bodyW * 0.74, wheelY, wheelR * 0.4, 0, Math.PI * 2); ctx.fill();

      // ラベル
      ctx.fillStyle = '#ffffff';
      ctx.font = `bold ${Math.round(17 * unit)}px -apple-system,sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText('明石台バス', s * 0.5, s * 0.90);

      // ダウンロード
      const link = document.createElement('a');
      link.download = 'icon-' + size + '.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }
  </script>
</body>
</html>
